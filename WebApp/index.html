<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="PEAK Game - Daily Map & Item Locations">
    <meta name="keywords" content="PEAK,PEAK Game,PEAK,PEAK Map,Daily map,Daily,PEAK Daily Map">
    <meta property="og:title" content="PEAK Game - Daily Map & Item Locations">
    <meta property="og:description" content="Check the daily map with item locations for the PEAK game. Updated daily!">
    <meta property="og:type" content="website">
    <meta name="robots" content="index, follow">
    <title>PEAK Daily Map</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
</head>
<body>
    <div class="standard-container">
        <div class="standard-container" id="container">
            <img id="map" src="./data/level_0.png" alt="Map">
        </div>
        <div id="settings">
            <p>Last updated: <b id="settings-lastupdated">...</b></p>
            <div class="settings-entry">
                <label for="luggage-checkbox">
                    <span></span>Luggage
                </label>
                <input type="checkbox" id="luggage-checkbox" onchange="switchLuggage(this)" checked>
            </div>
            <div class="settings-entry">
                <label for="belltowers-checkbox">
                    <span></span>Belltowers
                </label>
                <input type="checkbox" id="belltowers-checkbox" onchange="switchBelltowers(this)" checked>
            </div>
            <div class="settings-buttons">
                <button onclick="previousLevel()">Previous level</button>
                <button onclick="nextLevel()">Next level</button>
            </div>
        </div>
        <div id="item-popup">
            <span id="item-popup-image"></span>
            <p id="item-popup-name"></p>
        </div>
    </div>
    <iframe id="info-frame" class="data-frame" src="./data/info.json" onload="createInfo(this)"></iframe>
    <iframe id="luggage-frame" class="data-frame" src="./data/level_0_luggage.json" onload="createLuggage(this)"></iframe>
    <iframe id="belltowers-frame" class="data-frame" src="./data/level_0_belltowers.json" onload="createBelltowers(this)"></iframe>
</body>
</html>
